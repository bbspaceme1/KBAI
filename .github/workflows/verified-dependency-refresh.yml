name: Verified Dependency Refresh

on:
  push:
    branches:
      - fix/gitleaks-pr-base-ref-20261010
    paths:
      - .github/workflows/verified-dependency-refresh.yml

concurrency:
  group: verified-dependency-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-verify:
    name: Refresh lockfile, audit, and verify in isolated Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade affected direct tooling without force
        run: |
          set -euo pipefail
          npm pkg set 'devDependencies.vercel=^54.17.3' 'devDependencies.@lovable.dev/vite-tanstack-config=^2.26.6' 'devDependencies.vitest=^5.0.3' 'devDependencies.@vitest/coverage-v8=^5.0.3'
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || echo 'Non-forced audit fixes attempted; remaining advisories are reported separately.'

      - name: Install exact lockfile
        run: npm ci

      - name: Required quality checks
        run: |
          set -euo pipefail
          npm run lint:ci
          npm run type-check
          npm run build
          npm run test:run

      - name: Report full dependency audit findings
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            console.log("Dependency advisory counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              if (["high", "critical"].includes(item.severity)) {
                console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));
              }
            }
          '

      - uses: supabase/setup-cli@v1
        id: supabase-cli
        with:
          version: 2.120.0

      - name: Start isolated local Supabase stack
        run: supabase start --exclude studio,edge-runtime,logflare,vector,mailpit,imgproxy,realtime,storage-api,supavisor

      - name: Replay every migration from an empty database
        run: supabase db reset --local

      - name: Prepare isolated RLS test users and fixtures
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          API_URL="${API_URL:-${SUPABASE_URL:-}}"
          ANON_KEY="${ANON_KEY:-${SUPABASE_ANON_KEY:-${PUBLISHABLE_KEY:-}}}"
          SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SECRET_KEY:-}}}"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          for value in "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY"; do
            echo "::add-mask::$value"
          done
          node scripts/seed-local-rls-tests.cjs

      - name: Run behavioral RLS authorization matrix
        run: npm run test:rls
        env:
          RLS_TEST_ENVIRONMENT: isolated

      - name: Install Chromium for local browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run local homepage and login smoke tests
        run: npx playwright test e2e/basic.spec.ts --project=chromium

      - name: Stop isolated Supabase stack
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --no-backup

      - name: Commit verified lockfile update
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): refresh vulnerable tooling with verified lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
