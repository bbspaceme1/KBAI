name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency security audit (production surface)
        # Gate the dependency surface that runs in the deployed application.
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency security audit (full CI tree)
        # Keep CI/dev tooling visible without confusing it with runtime exposure.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Ensure PR base ref exists for secret scan
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test -n "$PR_BASE_REF"
          git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
          git rev-parse --verify "refs/remotes/origin/$PR_BASE_REF^{commit}"

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check merge conflicts
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.jsonc' '*.yml' '*.yaml'; then
            echo "❌ Merge conflicts detected!"
            exit 1
          fi
      - name: Lint
        run: npm run lint:ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Supabase admin guard check
        run: node ./scripts/check_supabase_admin_guards.cjs
      - name: Unit tests
        run: npm run test:run
      - name: Generate coverage report
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  integration:
    name: Integration and E2E
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Never run browser or RLS verification against production data. The
    # staging environment must contain isolated test users and database data.
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build client for secret scan
        run: npm run build
      - name: Verify no service-role key in client bundle
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          if grep -r -F -- "$SUPABASE_SERVICE_ROLE_KEY" dist/client/ 2>/dev/null; then
            echo "Service-role key value found in client build output"
            exit 1
          fi
      - name: Validate isolated staging integration secrets
        env:
          E2E_URL: ${{ secrets.STAGING_E2E_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          RLS_TEST_USER_A_TOKEN: ${{ secrets.STAGING_RLS_TEST_USER_A_TOKEN }}
          RLS_TEST_USER_A_ID: ${{ secrets.STAGING_RLS_TEST_USER_A_ID }}
          RLS_TEST_USER_B_ID: ${{ secrets.STAGING_RLS_TEST_USER_B_ID }}
          RLS_TEST_ADVISOR_TOKEN: ${{ secrets.STAGING_RLS_TEST_ADVISOR_TOKEN }}
          RLS_TEST_ADVISOR_ID: ${{ secrets.STAGING_RLS_TEST_ADVISOR_ID }}
          RLS_TEST_ASSIGNED_CLIENT_ID: ${{ secrets.STAGING_RLS_TEST_ASSIGNED_CLIENT_ID }}
          RLS_TEST_UNASSIGNED_CLIENT_ID: ${{ secrets.STAGING_RLS_TEST_UNASSIGNED_CLIENT_ID }}
        run: |
          test -n "$E2E_URL"
          test "$E2E_URL" != "http://localhost:3000"
          test -n "$SUPABASE_URL"
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::STAGING_SUPABASE_URL must be an HTTPS Supabase project URL"; exit 1 ;;
          esac
          staging_project_ref="${SUPABASE_URL#https://}"
          staging_project_ref="${staging_project_ref%%.*}"
          if [[ "$staging_project_ref" == "ejiufnrqvkvqzxroustb" ]]; then
            echo "::error::Refusing to run staging integration tests against the production Supabase project."
            exit 1
          fi
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$RLS_TEST_USER_A_TOKEN"
          test -n "$RLS_TEST_USER_A_ID"
          test -n "$RLS_TEST_USER_B_ID"
          test -n "$RLS_TEST_ADVISOR_TOKEN"
          test -n "$RLS_TEST_ADVISOR_ID"
          test -n "$RLS_TEST_ASSIGNED_CLIENT_ID"
          test -n "$RLS_TEST_UNASSIGNED_CLIENT_ID"
      - name: Behavioral RLS authorization gate
        run: npm run test:rls
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          RLS_TEST_USER_A_TOKEN: ${{ secrets.STAGING_RLS_TEST_USER_A_TOKEN }}
          RLS_TEST_USER_A_ID: ${{ secrets.STAGING_RLS_TEST_USER_A_ID }}
          RLS_TEST_USER_B_ID: ${{ secrets.STAGING_RLS_TEST_USER_B_ID }}
          RLS_TEST_ADVISOR_TOKEN: ${{ secrets.STAGING_RLS_TEST_ADVISOR_TOKEN }}
          RLS_TEST_ADVISOR_ID: ${{ secrets.STAGING_RLS_TEST_ADVISOR_ID }}
          RLS_TEST_ASSIGNED_CLIENT_ID: ${{ secrets.STAGING_RLS_TEST_ASSIGNED_CLIENT_ID }}
          RLS_TEST_UNASSIGNED_CLIENT_ID: ${{ secrets.STAGING_RLS_TEST_UNASSIGNED_CLIENT_ID }}
      - name: Install Playwright browsers and Linux dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E tests
        run: npm run test:e2e
        env:
          E2E_URL: ${{ secrets.STAGING_E2E_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
