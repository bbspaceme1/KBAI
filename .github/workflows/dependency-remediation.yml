name: Non-breaking dependency remediation

on:
  push:
    branches:
      - fix/gitleaks-pr-base-ref-20261010
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-remediation.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kbai-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate-and-test:
    name: Remediate compatible dependencies and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: fix/gitleaks-pr-base-ref-20261010

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply non-breaking npm audit fixes only
        shell: bash
        run: |
          set +e
          npm audit fix --no-fund
          status=$?
          set -e
          echo "npm audit fix exit code: $status"
          echo "Only npm's non-force remediation was attempted; no --force flag is used."
          # npm audit fix can return nonzero when some advisories require a major upgrade.
          # Continue so the exact resulting lockfile can be tested and reported.

      - name: Verify lockfile reproducibility
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

      - name: Report remaining dependency advisories
        id: audit
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          total="$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit-report.json)"
          high="$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit-report.json)"
          critical="$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "Remaining advisories: total=$total high=$high critical=$critical"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kbai-dependency-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Open dependency remediation PR
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(deps): apply tested non-breaking npm audit fixes"
          branch: automation/dependency-remediation-result
          delete-branch: true
          base: fix/gitleaks-pr-base-ref-20261010
          title: "fix(deps): apply tested non-breaking dependency fixes"
          body: |
            ## Automated non-breaking dependency remediation

            - Ran `npm audit fix` without `--force`.
            - Verified a clean `npm ci` from the resulting lockfile.
            - Ran lint, type-check, production build, and unit tests before opening this PR.
            - Full dependency audit remaining counts: **${{ steps.audit.outputs.total }} total, ${{ steps.audit.outputs.high }} high, ${{ steps.audit.outputs.critical }} critical**.
            - Major-version upgrades were not forced. Any remaining advisories need a separately reviewed upgrade and compatibility tests.

            This PR is isolated from production deployment. Merge only after the normal CI, migration replay, security gates, and human review pass.
