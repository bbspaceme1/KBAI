# This workflow is the SINGLE SOURCE OF TRUTH for production deployments.
# Vercel's native Git auto-deploy for this project MUST be disabled in the
# Vercel dashboard (Project Settings > Git > toggle off "Deploy Hooks" /
# "Auto-deploy on push" or disconnect the GitHub integration for Production
# Branch).
# If you see a deployment in the Vercel dashboard whose trigger was NOT this
# workflow, that is a governance violation — investigate immediately.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
