# This workflow is the SINGLE SOURCE OF TRUTH for production deployments.
# Vercel's native Git auto-deploy for this project MUST be disabled in the
# Vercel dashboard (Project Settings > Git > toggle off "Deploy Hooks" /
# "Auto-deploy on push" or disconnect the GitHub integration for Production
# Branch).
# If you see a deployment in the Vercel dashboard whose trigger was NOT this
# workflow, that is a governance violation — investigate immediately.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Required quality, integration and E2E gates
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  database-gate:
    name: Required database drift gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/db-drift-check.yml
    secrets: inherit

  deploy:
    name: Deploy to Vercel production
    if: github.ref == 'refs/heads/main'
    needs: [quality-gates, database-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
