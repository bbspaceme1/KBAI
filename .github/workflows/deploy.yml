# This workflow is the SINGLE SOURCE OF TRUTH for production deployments.
# Vercel's native Git auto-deploy for this project MUST be disabled in the
# Vercel dashboard (Project Settings > Git > toggle off "Deploy Hooks" /
# "Auto-deploy on push" or disconnect the GitHub integration for Production
# Branch).
# If you see a deployment in the Vercel dashboard whose trigger was NOT this
# workflow, that is a governance violation — investigate immediately.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Required quality, integration and E2E gates
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  database-gate:
    name: Required database drift gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/db-drift-check.yml
    secrets: inherit

  deploy:
    name: Deploy to Vercel production
    if: github.ref == 'refs/heads/main'
    needs: [quality-gates, database-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Vercel (production)
        id: vercel-deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes 2>&1 | tee "$RUNNER_TEMP/vercel-deploy.log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$RUNNER_TEMP/vercel-deploy.log" | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "::error::Vercel did not return a deployment URL"
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify deployed commit and public smoke paths
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:production
          deployment_json="$(npx vercel inspect "$SMOKE_BASE_URL" --token="$VERCEL_TOKEN" --json)"
          ready_state="$(printf '%s' "$deployment_json" | jq -r '.readyState // .state // empty')"
          commit_sha="$(printf '%s' "$deployment_json" | jq -r '.meta.githubCommitSha // .meta.githubCommitRef // empty')"
          [[ "$ready_state" == "READY" ]] || { echo "::error::Deployment state is $ready_state"; exit 1; }
          [[ "$commit_sha" == "$EXPECTED_COMMIT" ]] || { echo "::error::Deployment commit $commit_sha does not match $EXPECTED_COMMIT"; exit 1; }
        env:
          SMOKE_BASE_URL: ${{ steps.vercel-deploy.outputs.deployment_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
