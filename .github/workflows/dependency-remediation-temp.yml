name: Temporary dependency remediation artifact
on:
  push:
    branches: [staging/preview-bootstrap]
permissions:
  contents: read
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install baseline lockfile
        run: npm ci
      - name: Apply non-breaking audit fixes only
        run: npm audit fix
      - name: Capture final audit reports
        if: always()
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-full.json || true
          npm audit --omit=dev --json > artifacts/npm-audit-production.json || true
          cp package.json artifacts/package.json
          cp package-lock.json artifacts/package-lock.json
      - name: Upload candidate manifest, lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
