name: Temporary Vite lockfile resolver

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  resolve-vite-lockfile:
    if: github.event.pull_request.head.ref == 'staging/preview-bootstrap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve compatible patched dependencies through npm registry
        run: |
          npm ci
          npm audit fix --package-lock-only
          node --input-type=module -e "import fs from 'node:fs'; const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); const v=l.packages['node_modules/vite']?.version; console.log('Resolved Vite:',v); if (!v || v === '7.3.6') process.exit(1);"
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "fix(deps): resolve patched Vite dependency tree"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          fi
